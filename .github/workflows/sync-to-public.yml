name: Sync Release from StarX_REPO

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-release-from-private
  cancel-in-progress: false

env:
  PRIVATE_REPO: Mai-xiyu/StarX_REPO
  PUBLIC_REPO: Mai-xiyu/StarX
  XPOSED_REPO: Xposed-Modules-Repo/org.xiyu.starx

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch latest private release
        id: fetch
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${REPO_PAT:-}" ]; then
            echo "::error::Missing REPO_PAT. This workflow uses it for cross-repository release reads and writes."
            echo "::error::REPO_PAT must have Contents: read on ${PRIVATE_REPO}, Contents: write on ${PUBLIC_REPO}, and Contents: write on ${XPOSED_REPO} if the mirror step is enabled."
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          headers=(
            -H "Authorization: Bearer ${REPO_PAT}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          status=$(curl -sS -L -o upstream_releases.json -w "%{http_code}" \
            "${headers[@]}" \
            "https://api.github.com/repos/${PRIVATE_REPO}/releases?per_page=100")

          if [ "$status" != "200" ]; then
            echo "::error::Failed to list releases from ${PRIVATE_REPO} (HTTP ${status})."
            echo "::error::If this is 404, the token cannot read the private repository."
            cat upstream_releases.json
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          selected_release=$(jq -c '
            def semver:
              capture("^v?(?<major>0|[1-9][0-9]*)\\.(?<minor>0|[1-9][0-9]*)\\.(?<patch>0|[1-9][0-9]*)(?:[-+].*)?$")?;

            [
              .[]
              | select(.draft == false and .prerelease == false)
              | . as $release
              | ($release.tag_name | semver) as $version
              | select($version != null)
              | $release + {
                  _major: ($version.major | tonumber),
                  _minor: ($version.minor | tonumber),
                  _patch: ($version.patch | tonumber)
                }
            ]
            | sort_by(._major, ._minor, ._patch, .created_at)
            | last
          ' upstream_releases.json)

          if [ -z "$selected_release" ] || [ "$selected_release" = "null" ]; then
            echo "No published semantic-version release found in ${PRIVATE_REPO}; skip and retry on the next run."
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "$selected_release" | jq 'del(._major, ._minor, ._patch)' > upstream_release.json

          upstream_tag=$(jq -r '.tag_name // empty' upstream_release.json)
          upstream_name=$(jq -r '.name // .tag_name // empty' upstream_release.json)
          asset_name=$(jq -r '[.assets[]? | select(.name | test("\\.apk$"; "i"))][0].name // .assets[0].name // empty' upstream_release.json)
          asset_url=$(jq -r --arg name "$asset_name" '.assets[]? | select(.name == $name) | .url // empty' upstream_release.json)
          body_b64=$(jq -r '.body // ""' upstream_release.json | base64 -w0)

          if [ -z "$upstream_tag" ]; then
            echo "No valid upstream tag."
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$asset_name" ] || [ -z "$asset_url" ]; then
            echo "Upstream ${upstream_tag} has no release asset yet; skip and retry on the next run."
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          public_tag="$upstream_tag"

          echo "Upstream tag: ${upstream_tag}"
          echo "Public tag: ${public_tag}"
          echo "Selected asset: ${asset_name}"
          echo "upstream_tag=${upstream_tag}" >> "$GITHUB_OUTPUT"
          echo "public_tag=${public_tag}" >> "$GITHUB_OUTPUT"
          echo "upstream_name=${upstream_name}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"
          echo "asset_url=${asset_url}" >> "$GITHUB_OUTPUT"
          echo "upstream_body_b64=${body_b64}" >> "$GITHUB_OUTPUT"
          echo "public_release_id=" >> "$GITHUB_OUTPUT"

          public_status=$(curl -sS -L -o public_release.json -w "%{http_code}" \
            "${headers[@]}" \
            "https://api.github.com/repos/${PUBLIC_REPO}/releases/tags/${public_tag}")

          case "$public_status" in
            200)
              public_assets=$(jq -r '(.assets // []) | length' public_release.json)
              if [ "$public_assets" -gt 0 ]; then
                echo "Tag ${public_tag} already exists on ${PUBLIC_REPO} with ${public_assets} asset(s); skip."
                echo "has_new=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              public_release_id=$(jq -r '.id' public_release.json)
              echo "Tag ${public_tag} exists on ${PUBLIC_REPO} without assets; reusing release ${public_release_id}."
              echo "public_release_id=${public_release_id}" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "New public release detected: ${public_tag}"
              ;;
            *)
              echo "::error::Failed to check ${PUBLIC_REPO} release ${public_tag} (HTTP ${public_status})."
              cat public_release.json
              echo "has_new=false" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac

          echo "has_new=true" >> "$GITHUB_OUTPUT"

      - name: Download release asset
        if: steps.fetch.outputs.has_new == 'true'
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          set -euo pipefail

          asset_name='${{ steps.fetch.outputs.asset_name }}'
          asset_url='${{ steps.fetch.outputs.asset_url }}'

          curl -fL -sS \
            -H "Authorization: Bearer ${REPO_PAT}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$asset_url" \
            -o "$asset_name"

          test -s "$asset_name"
          ls -lh "$asset_name"

      - name: Create public release
        if: steps.fetch.outputs.has_new == 'true'
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          set -euo pipefail

          tag='${{ steps.fetch.outputs.public_tag }}'
          name='${{ steps.fetch.outputs.upstream_name }}'
          body="$(printf '%s' '${{ steps.fetch.outputs.upstream_body_b64 }}' | base64 -d)"
          asset_file='${{ steps.fetch.outputs.asset_name }}'
          existing_release_id='${{ steps.fetch.outputs.public_release_id }}'

          headers=(
            -H "Authorization: Bearer ${REPO_PAT}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          if [ -n "$existing_release_id" ]; then
            release_id="$existing_release_id"
            echo "Using existing public release ${release_id} for ${tag}."
          else
            repo_status=$(curl -sS -L -o public_repo.json -w "%{http_code}" \
              "${headers[@]}" \
              "https://api.github.com/repos/${PUBLIC_REPO}")
            if [ "$repo_status" != "200" ]; then
              echo "::error::Failed to read ${PUBLIC_REPO} metadata (HTTP ${repo_status})."
              cat public_repo.json
              exit 1
            fi

            default_branch=$(jq -r '.default_branch' public_repo.json)
            release_status=$(curl -sS -L -o create_public_release.json -w "%{http_code}" -X POST \
              "${headers[@]}" \
              "https://api.github.com/repos/${PUBLIC_REPO}/releases" \
              -d "$(jq -n \
                --arg tag "$tag" \
                --arg target "$default_branch" \
                --arg name "$name" \
                --arg body "$body" \
                '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: false, prerelease: false}')")
            if [ "$release_status" != "201" ]; then
              echo "::error::Failed to create release ${tag} on ${PUBLIC_REPO} (HTTP ${release_status})."
              echo "::error::If the response says Reference update failed, repository rules or the REPO_PAT actor still block creating refs/tags/${tag}."
              cat create_public_release.json
              exit 1
            fi

            release_id=$(jq -r '.id' create_public_release.json)
          fi

          upload_name=$(jq -rn --arg v "$asset_file" '$v|@uri')
          upload_status=$(curl -sS -L -o upload_public_asset.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${REPO_PAT}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://uploads.github.com/repos/${PUBLIC_REPO}/releases/${release_id}/assets?name=${upload_name}" \
            --data-binary "@${asset_file}")
          if [ "$upload_status" != "201" ]; then
            echo "::error::Failed to upload ${asset_file} to ${PUBLIC_REPO} release ${tag} (HTTP ${upload_status})."
            cat upload_public_asset.json
            exit 1
          fi

          echo "Uploaded ${asset_file} to ${PUBLIC_REPO} release ${tag}."

          releases_status=$(curl -sS -L -o public_releases.json -w "%{http_code}" \
            "${headers[@]}" \
            "https://api.github.com/repos/${PUBLIC_REPO}/releases?per_page=100")
          if [ "$releases_status" != "200" ]; then
            echo "::warning::Failed to list ${PUBLIC_REPO} releases for cleanup (HTTP ${releases_status})."
            cat public_releases.json
          else
            jq -r --arg current "$release_id" '.[] | select((.id | tostring) != $current) | .id' public_releases.json | while read -r old_release_id; do
              [ -z "$old_release_id" ] && continue
              echo "Deleting old public release ${old_release_id}"
              curl -sfL -X DELETE \
                "${headers[@]}" \
                "https://api.github.com/repos/${PUBLIC_REPO}/releases/${old_release_id}" || true
            done
          fi

          tags_status=$(curl -sS -L -o public_tags.json -w "%{http_code}" \
            "${headers[@]}" \
            "https://api.github.com/repos/${PUBLIC_REPO}/git/matching-refs/tags")
          if [ "$tags_status" = "409" ]; then
            echo "[]" > public_tags.json
            tags_status="200"
          fi
          if [ "$tags_status" != "200" ]; then
            echo "::warning::Failed to list ${PUBLIC_REPO} tags for cleanup (HTTP ${tags_status})."
            cat public_tags.json
          else
            current_ref="refs/tags/${tag}"
            jq -r --arg current "$current_ref" '.[] | select(.ref != $current) | .ref // empty' public_tags.json | while read -r ref; do
              [ -z "$ref" ] && continue
              echo "Deleting old public ${ref}"
              curl -sfL -X DELETE \
                "${headers[@]}" \
                "https://api.github.com/repos/${PUBLIC_REPO}/git/${ref}" || true
            done
          fi

      - name: Mirror to Xposed-Modules-Repo/org.xiyu.starx
        if: steps.fetch.outputs.has_new == 'true'
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          set -euo pipefail

          tag='${{ steps.fetch.outputs.upstream_tag }}'
          name='${{ steps.fetch.outputs.upstream_name }}'
          body="$(printf '%s' '${{ steps.fetch.outputs.upstream_body_b64 }}' | base64 -d)"
          asset_file='${{ steps.fetch.outputs.asset_name }}'

          headers=(
            -H "Authorization: Bearer ${REPO_PAT}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          xposed_status=$(curl -sS -L -o xposed_release.json -w "%{http_code}" \
            "${headers[@]}" \
            "https://api.github.com/repos/${XPOSED_REPO}/releases/tags/${tag}")

          upload_needed=true
          case "$xposed_status" in
            200)
              release_id=$(jq -r '.id' xposed_release.json)
              xposed_assets=$(jq -r '(.assets // []) | length' xposed_release.json)
              if [ "$xposed_assets" -gt 0 ]; then
                upload_needed=false
                echo "Xposed release ${tag} already has ${xposed_assets} asset(s)."
              else
                echo "Using existing Xposed release ${release_id} for ${tag}."
              fi
              ;;
            404)
              repo_status=$(curl -sS -L -o xposed_repo.json -w "%{http_code}" \
                "${headers[@]}" \
                "https://api.github.com/repos/${XPOSED_REPO}")
              if [ "$repo_status" != "200" ]; then
                echo "::error::Failed to read ${XPOSED_REPO} metadata (HTTP ${repo_status})."
                cat xposed_repo.json
                exit 1
              fi

              default_branch=$(jq -r '.default_branch' xposed_repo.json)
              release_status=$(curl -sS -L -o create_xposed_release.json -w "%{http_code}" -X POST \
                "${headers[@]}" \
                "https://api.github.com/repos/${XPOSED_REPO}/releases" \
                -d "$(jq -n \
                  --arg tag "$tag" \
                  --arg target "$default_branch" \
                  --arg name "$name" \
                  --arg body "$body" \
                  '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: false, prerelease: false}')")
              if [ "$release_status" != "201" ]; then
                echo "::error::Failed to create release ${tag} on ${XPOSED_REPO} (HTTP ${release_status})."
                echo "::error::If the response says Reference update failed, repository rules or the REPO_PAT actor still block creating refs/tags/${tag}."
                cat create_xposed_release.json
                exit 1
              fi
              release_id=$(jq -r '.id' create_xposed_release.json)
              ;;
            *)
              echo "::error::Failed to check ${XPOSED_REPO} release ${tag} (HTTP ${xposed_status})."
              cat xposed_release.json
              exit 1
              ;;
          esac

          if [ "$upload_needed" = true ]; then
            upload_name=$(jq -rn --arg v "$asset_file" '$v|@uri')
            upload_status=$(curl -sS -L -o upload_xposed_asset.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${REPO_PAT}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://uploads.github.com/repos/${XPOSED_REPO}/releases/${release_id}/assets?name=${upload_name}" \
              --data-binary "@${asset_file}")
            if [ "$upload_status" != "201" ]; then
              echo "::error::Failed to upload ${asset_file} to ${XPOSED_REPO} release ${tag} (HTTP ${upload_status})."
              cat upload_xposed_asset.json
              exit 1
            fi
            echo "Uploaded ${asset_file} to ${XPOSED_REPO} release ${tag}."
          fi

          releases_status=$(curl -sS -L -o xposed_releases.json -w "%{http_code}" \
            "${headers[@]}" \
            "https://api.github.com/repos/${XPOSED_REPO}/releases?per_page=100")
          if [ "$releases_status" != "200" ]; then
            echo "::warning::Failed to list ${XPOSED_REPO} releases for cleanup (HTTP ${releases_status})."
            cat xposed_releases.json
          else
            jq -r --arg current "$release_id" '.[] | select((.id | tostring) != $current) | .id' xposed_releases.json | while read -r old_release_id; do
              [ -z "$old_release_id" ] && continue
              echo "Deleting old Xposed release ${old_release_id}"
              curl -sfL -X DELETE \
                "${headers[@]}" \
                "https://api.github.com/repos/${XPOSED_REPO}/releases/${old_release_id}" || true
            done
          fi

          tags_status=$(curl -sS -L -o xposed_tags.json -w "%{http_code}" \
            "${headers[@]}" \
            "https://api.github.com/repos/${XPOSED_REPO}/git/matching-refs/tags")
          if [ "$tags_status" = "409" ]; then
            echo "[]" > xposed_tags.json
            tags_status="200"
          fi
          if [ "$tags_status" != "200" ]; then
            echo "::warning::Failed to list ${XPOSED_REPO} tags for cleanup (HTTP ${tags_status})."
            cat xposed_tags.json
          else
            current_ref="refs/tags/${tag}"
            jq -r --arg current "$current_ref" '.[] | select(.ref != $current) | .ref // empty' xposed_tags.json | while read -r ref; do
              [ -z "$ref" ] && continue
              echo "Deleting old Xposed ${ref}"
              curl -sfL -X DELETE \
                "${headers[@]}" \
                "https://api.github.com/repos/${XPOSED_REPO}/git/${ref}" || true
            done
          fi
