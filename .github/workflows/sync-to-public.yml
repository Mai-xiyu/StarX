name: Sync Release from StarX_REPO

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-release-from-private
  cancel-in-progress: false

env:
  PRIVATE_REPO: Mai-xiyu/StarX_REPO
  PUBLIC_REPO: Mai-xiyu/StarX
  XPOSED_REPO: Xposed-Modules-Repo/org.xiyu.starx

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch latest private release
        id: fetch
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${REPO_PAT:-}" ]; then
            echo "::error::Missing REPO_PAT. This workflow uses it for cross-repository release reads and writes."
            echo "::error::REPO_PAT must have Contents: read on ${PRIVATE_REPO}, Contents: write on ${PUBLIC_REPO}, and Contents: write on ${XPOSED_REPO} if the mirror step is enabled."
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          headers=(
            -H "Authorization: Bearer ${REPO_PAT}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          status=$(curl -sS -L -o upstream_release.json -w "%{http_code}" \
            "${headers[@]}" \
            "https://api.github.com/repos/${PRIVATE_REPO}/releases/latest")

          if [ "$status" != "200" ]; then
            echo "::error::Failed to fetch latest release from ${PRIVATE_REPO} (HTTP ${status})."
            echo "::error::If this is 404, the token cannot read the private repository or no published release exists."
            cat upstream_release.json
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          upstream_tag=$(jq -r '.tag_name // empty' upstream_release.json)
          upstream_name=$(jq -r '.name // .tag_name // empty' upstream_release.json)
          asset_name=$(jq -r '[.assets[]? | select(.name | test("\\.apk$"; "i"))][0].name // .assets[0].name // empty' upstream_release.json)
          asset_url=$(jq -r --arg name "$asset_name" '.assets[]? | select(.name == $name) | .url // empty' upstream_release.json)
          body_b64=$(jq -r '.body // ""' upstream_release.json | base64 -w0)

          if [ -z "$upstream_tag" ]; then
            echo "No valid upstream tag."
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$asset_name" ] || [ -z "$asset_url" ]; then
            echo "Upstream ${upstream_tag} has no release asset yet; skip and retry on the next run."
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Upstream tag: ${upstream_tag}"
          echo "Selected asset: ${asset_name}"
          echo "upstream_tag=${upstream_tag}" >> "$GITHUB_OUTPUT"
          echo "upstream_name=${upstream_name}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"
          echo "asset_url=${asset_url}" >> "$GITHUB_OUTPUT"
          echo "upstream_body_b64=${body_b64}" >> "$GITHUB_OUTPUT"

          public_status=$(curl -sS -L -o public_release.json -w "%{http_code}" \
            "${headers[@]}" \
            "https://api.github.com/repos/${PUBLIC_REPO}/releases/tags/${upstream_tag}")

          case "$public_status" in
            200)
              public_assets=$(jq -r '(.assets // []) | length' public_release.json)
              if [ "$public_assets" -gt 0 ]; then
                echo "Tag ${upstream_tag} already exists on ${PUBLIC_REPO} with ${public_assets} asset(s); skip."
                echo "has_new=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Tag ${upstream_tag} exists on ${PUBLIC_REPO} without assets; re-syncing."
              ;;
            404)
              echo "New release detected: ${upstream_tag}"
              ;;
            *)
              echo "::error::Failed to check ${PUBLIC_REPO} release ${upstream_tag} (HTTP ${public_status})."
              cat public_release.json
              echo "has_new=false" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac

          echo "has_new=true" >> "$GITHUB_OUTPUT"

      - name: Download release asset
        if: steps.fetch.outputs.has_new == 'true'
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          set -euo pipefail

          asset_name='${{ steps.fetch.outputs.asset_name }}'
          asset_url='${{ steps.fetch.outputs.asset_url }}'

          curl -fL -sS \
            -H "Authorization: Bearer ${REPO_PAT}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$asset_url" \
            -o "$asset_name"

          test -s "$asset_name"
          ls -lh "$asset_name"

      - name: Delete old public releases and tags
        if: steps.fetch.outputs.has_new == 'true'
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          set -euo pipefail

          headers=(
            -H "Authorization: Bearer ${REPO_PAT}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          releases_status=$(curl -sS -L -o public_releases.json -w "%{http_code}" \
            "${headers[@]}" \
            "https://api.github.com/repos/${PUBLIC_REPO}/releases?per_page=100")
          if [ "$releases_status" != "200" ]; then
            echo "::error::Failed to list ${PUBLIC_REPO} releases (HTTP ${releases_status})."
            cat public_releases.json
            exit 1
          fi

          jq -r '.[].id' public_releases.json | while read -r release_id; do
            [ -z "$release_id" ] && continue
            echo "Deleting release ${release_id}"
            curl -sfL -X DELETE \
              "${headers[@]}" \
              "https://api.github.com/repos/${PUBLIC_REPO}/releases/${release_id}" || true
          done

          tags_status=$(curl -sS -L -o public_tags.json -w "%{http_code}" \
            "${headers[@]}" \
            "https://api.github.com/repos/${PUBLIC_REPO}/git/matching-refs/tags")
          if [ "$tags_status" != "200" ] && [ "$tags_status" != "409" ]; then
            echo "::error::Failed to list ${PUBLIC_REPO} tags (HTTP ${tags_status})."
            cat public_tags.json
            exit 1
          fi
          if [ "$tags_status" = "409" ]; then
            echo "[]" > public_tags.json
          fi

          jq -r '.[].ref // empty' public_tags.json | while read -r ref; do
            [ -z "$ref" ] && continue
            echo "Deleting ${ref}"
            curl -sfL -X DELETE \
              "${headers[@]}" \
              "https://api.github.com/repos/${PUBLIC_REPO}/git/${ref}" || true
          done

      - name: Create public release
        if: steps.fetch.outputs.has_new == 'true'
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          set -euo pipefail

          tag='${{ steps.fetch.outputs.upstream_tag }}'
          name='${{ steps.fetch.outputs.upstream_name }}'
          body="$(printf '%s' '${{ steps.fetch.outputs.upstream_body_b64 }}' | base64 -d)"
          asset_file='${{ steps.fetch.outputs.asset_name }}'

          headers=(
            -H "Authorization: Bearer ${REPO_PAT}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          repo_status=$(curl -sS -L -o public_repo.json -w "%{http_code}" \
            "${headers[@]}" \
            "https://api.github.com/repos/${PUBLIC_REPO}")
          if [ "$repo_status" != "200" ]; then
            echo "::error::Failed to read ${PUBLIC_REPO} metadata (HTTP ${repo_status})."
            cat public_repo.json
            exit 1
          fi

          default_branch=$(jq -r '.default_branch' public_repo.json)
          ref_status=$(curl -sS -L -o public_branch.json -w "%{http_code}" \
            "${headers[@]}" \
            "https://api.github.com/repos/${PUBLIC_REPO}/git/ref/heads/${default_branch}")
          if [ "$ref_status" != "200" ]; then
            echo "::error::Failed to read ${PUBLIC_REPO} ${default_branch} ref (HTTP ${ref_status})."
            cat public_branch.json
            exit 1
          fi

          target_sha=$(jq -r '.object.sha' public_branch.json)
          tag_status=$(curl -sS -L -o create_public_tag.json -w "%{http_code}" -X POST \
            "${headers[@]}" \
            "https://api.github.com/repos/${PUBLIC_REPO}/git/refs" \
            -d "$(jq -n --arg ref "refs/tags/${tag}" --arg sha "$target_sha" '{ref: $ref, sha: $sha}')")
          if [ "$tag_status" != "201" ]; then
            echo "::error::Failed to create tag ${tag} on ${PUBLIC_REPO} (HTTP ${tag_status})."
            cat create_public_tag.json
            exit 1
          fi

          release_status=$(curl -sS -L -o create_public_release.json -w "%{http_code}" -X POST \
            "${headers[@]}" \
            "https://api.github.com/repos/${PUBLIC_REPO}/releases" \
            -d "$(jq -n \
              --arg tag "$tag" \
              --arg name "$name" \
              --arg body "$body" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')")
          if [ "$release_status" != "201" ]; then
            echo "::error::Failed to create release ${tag} on ${PUBLIC_REPO} (HTTP ${release_status})."
            cat create_public_release.json
            exit 1
          fi

          release_id=$(jq -r '.id' create_public_release.json)
          upload_name=$(jq -rn --arg v "$asset_file" '$v|@uri')
          upload_status=$(curl -sS -L -o upload_public_asset.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${REPO_PAT}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://uploads.github.com/repos/${PUBLIC_REPO}/releases/${release_id}/assets?name=${upload_name}" \
            --data-binary "@${asset_file}")
          if [ "$upload_status" != "201" ]; then
            echo "::error::Failed to upload ${asset_file} to ${PUBLIC_REPO} release ${tag} (HTTP ${upload_status})."
            cat upload_public_asset.json
            exit 1
          fi

          echo "Uploaded ${asset_file} to ${PUBLIC_REPO} release ${tag}."

      - name: Mirror to Xposed-Modules-Repo/org.xiyu.starx
        if: steps.fetch.outputs.has_new == 'true'
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          set -euo pipefail

          tag='${{ steps.fetch.outputs.upstream_tag }}'
          name='${{ steps.fetch.outputs.upstream_name }}'
          body="$(printf '%s' '${{ steps.fetch.outputs.upstream_body_b64 }}' | base64 -d)"
          asset_file='${{ steps.fetch.outputs.asset_name }}'

          headers=(
            -H "Authorization: Bearer ${REPO_PAT}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          releases_status=$(curl -sS -L -o xposed_releases.json -w "%{http_code}" \
            "${headers[@]}" \
            "https://api.github.com/repos/${XPOSED_REPO}/releases?per_page=100")
          if [ "$releases_status" != "200" ]; then
            echo "::error::Failed to list ${XPOSED_REPO} releases (HTTP ${releases_status})."
            cat xposed_releases.json
            exit 1
          fi

          jq -r '.[].id' xposed_releases.json | while read -r release_id; do
            [ -z "$release_id" ] && continue
            echo "Deleting Xposed release ${release_id}"
            curl -sfL -X DELETE \
              "${headers[@]}" \
              "https://api.github.com/repos/${XPOSED_REPO}/releases/${release_id}" || true
          done

          tags_status=$(curl -sS -L -o xposed_tags.json -w "%{http_code}" \
            "${headers[@]}" \
            "https://api.github.com/repos/${XPOSED_REPO}/git/matching-refs/tags")
          if [ "$tags_status" != "200" ] && [ "$tags_status" != "409" ]; then
            echo "::error::Failed to list ${XPOSED_REPO} tags (HTTP ${tags_status})."
            cat xposed_tags.json
            exit 1
          fi
          if [ "$tags_status" = "409" ]; then
            echo "[]" > xposed_tags.json
          fi

          jq -r '.[].ref // empty' xposed_tags.json | while read -r ref; do
            [ -z "$ref" ] && continue
            echo "Deleting Xposed ${ref}"
            curl -sfL -X DELETE \
              "${headers[@]}" \
              "https://api.github.com/repos/${XPOSED_REPO}/git/${ref}" || true
          done

          repo_status=$(curl -sS -L -o xposed_repo.json -w "%{http_code}" \
            "${headers[@]}" \
            "https://api.github.com/repos/${XPOSED_REPO}")
          if [ "$repo_status" != "200" ]; then
            echo "::error::Failed to read ${XPOSED_REPO} metadata (HTTP ${repo_status})."
            cat xposed_repo.json
            exit 1
          fi

          default_branch=$(jq -r '.default_branch' xposed_repo.json)
          ref_status=$(curl -sS -L -o xposed_branch.json -w "%{http_code}" \
            "${headers[@]}" \
            "https://api.github.com/repos/${XPOSED_REPO}/git/ref/heads/${default_branch}")
          if [ "$ref_status" != "200" ]; then
            echo "::error::Failed to read ${XPOSED_REPO} ${default_branch} ref (HTTP ${ref_status})."
            cat xposed_branch.json
            exit 1
          fi

          target_sha=$(jq -r '.object.sha' xposed_branch.json)
          tag_status=$(curl -sS -L -o create_xposed_tag.json -w "%{http_code}" -X POST \
            "${headers[@]}" \
            "https://api.github.com/repos/${XPOSED_REPO}/git/refs" \
            -d "$(jq -n --arg ref "refs/tags/${tag}" --arg sha "$target_sha" '{ref: $ref, sha: $sha}')")
          if [ "$tag_status" != "201" ]; then
            echo "::error::Failed to create tag ${tag} on ${XPOSED_REPO} (HTTP ${tag_status})."
            cat create_xposed_tag.json
            exit 1
          fi

          release_status=$(curl -sS -L -o create_xposed_release.json -w "%{http_code}" -X POST \
            "${headers[@]}" \
            "https://api.github.com/repos/${XPOSED_REPO}/releases" \
            -d "$(jq -n \
              --arg tag "$tag" \
              --arg name "$name" \
              --arg body "$body" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')")
          if [ "$release_status" != "201" ]; then
            echo "::error::Failed to create release ${tag} on ${XPOSED_REPO} (HTTP ${release_status})."
            cat create_xposed_release.json
            exit 1
          fi

          release_id=$(jq -r '.id' create_xposed_release.json)
          upload_name=$(jq -rn --arg v "$asset_file" '$v|@uri')
          upload_status=$(curl -sS -L -o upload_xposed_asset.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${REPO_PAT}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://uploads.github.com/repos/${XPOSED_REPO}/releases/${release_id}/assets?name=${upload_name}" \
            --data-binary "@${asset_file}")
          if [ "$upload_status" != "201" ]; then
            echo "::error::Failed to upload ${asset_file} to ${XPOSED_REPO} release ${tag} (HTTP ${upload_status})."
            cat upload_xposed_asset.json
            exit 1
          fi

          echo "Uploaded ${asset_file} to ${XPOSED_REPO} release ${tag}."
